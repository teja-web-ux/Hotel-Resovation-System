<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book your room | Star Hotel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700&family=Marcellus&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="css/style.css"></head>
<body data-page="booking"><div id="loader"><i class="fa-solid fa-star"></i></div><header id="nav"></header>
<section class="page-hero"><div class="wrap"><h1>Reserve your room</h1><p>Guest details, dates and a clear price before you pay.</p></div></section>
<section class="sec" style="padding-top:40px"><div class="wrap two"><form class="card" id="bookForm" novalidate><h3 style="margin-bottom:18px">Guest information</h3>
<div class="row"><div class="field"><label for="name">Full name</label><input id="name" name="name" type="text" ><span class="err" id="e_name"></span></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" ><span class="err" id="e_email"></span></div></div><div class="row"><div class="field"><label for="phone">Phone (10 digits)</label><input id="phone" name="phone" type="tel" ><span class="err" id="e_phone"></span></div><div class="field"><label for="roomId">Room</label><select id="roomId" name="roomId"></select></div></div>
<div class="row"><div class="field"><label for="checkIn">Check-in</label><input id="checkIn" name="checkIn" type="date" ><span class="err" id="e_checkIn"></span></div><div class="field"><label for="checkOut">Check-out</label><input id="checkOut" name="checkOut" type="date" ><span class="err" id="e_checkOut"></span></div></div><div class="row"><div class="field"><label for="guests">Guests</label><select id="guests" name="guests"></select><span class="err" id="e_guests"></span></div><div></div></div>
<div class="field"><label for="requests">Special requests</label><textarea id="requests" name="requests" rows="3" placeholder="Late arrival, extra bed, dietary needs…"></textarea></div><button class="btn">Confirm reservation</button></form>
<aside class="card" id="summary"></aside></div></section>
<footer id="foot"></footer><div id="toasts" aria-live="polite"></div><script src="js/app.js"></script><script src="js/auth.js"></script><script src="js/booking.js"></script></body></html>
