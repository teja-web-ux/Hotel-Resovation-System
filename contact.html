<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | Star Hotel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700&family=Marcellus&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="css/style.css"></head>
<body data-page="contact"><div id="loader"><i class="fa-solid fa-star"></i></div><header id="nav"></header>
<section class="page-hero"><div class="wrap"><h1>Contact us</h1><p>Questions about a stay? We reply within one working day.</p></div></section>
<section class="sec" style="padding-top:40px"><div class="wrap two"><form class="card" id="contactForm" novalidate><h3 style="margin-bottom:16px">Send a message</h3><div class="field"><label for="name">Your name</label><input id="name" name="name" type="text" ><span class="err" id="e_name"></span></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" ><span class="err" id="e_email"></span></div><div class="field"><label for="subject">Subject</label><input id="subject" name="subject" type="text" ><span class="err" id="e_subject"></span></div>
<div class="field"><label for="message">Message</label><textarea id="message" name="message" rows="5"></textarea><span class="err" id="e_message"></span></div><button class="btn">Send message</button></form>
<div><div class="card" style="margin-bottom:20px"><h3 style="margin-bottom:12px">Hotel details</h3><p><i class="fa-solid fa-location-dot"></i> 12 Skyline Avenue, Colaba, Mumbai 400005</p><p><i class="fa-solid fa-phone"></i> +91 22 4000 1234</p><p><i class="fa-solid fa-envelope"></i> stay@starhotel.com</p><p><i class="fa-regular fa-clock"></i> Front desk: open 24 hours<br>Reservations: 8 AM to 10 PM daily</p></div>
<iframe class="map" title="Star Hotel location" loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=72.80%2C18.90%2C72.86%2C18.94&amp;layer=mapnik"></iframe></div></div></section>
<footer id="foot"></footer><div id="toasts" aria-live="polite"></div><script src="js/app.js"></script><script src="js/auth.js"></script></body></html>
