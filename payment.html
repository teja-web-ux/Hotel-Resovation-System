<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment | Star Hotel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700&family=Marcellus&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="css/style.css"></head>
<body data-page="payment"><div id="loader"><i class="fa-solid fa-star"></i></div><header id="nav"></header>
<section class="page-hero"><div class="wrap"><h1>Payment</h1><p>Demo checkout: no real payment is processed.</p></div></section>
<section class="sec" style="padding-top:40px"><div class="wrap" id="payBox"><div class="two"><form class="card" id="payForm" novalidate><h3 style="margin-bottom:16px">Choose a payment method</h3>
<div class="pay-tabs"><label><input type="radio" name="method" value="card" checked><i class="fa-solid fa-credit-card"></i>Card</label><label><input type="radio" name="method" value="upi" ><i class="fa-solid fa-mobile-screen"></i>UPI</label><label><input type="radio" name="method" value="bank" ><i class="fa-solid fa-building-columns"></i>Net Banking</label><label><input type="radio" name="method" value="cash" ><i class="fa-solid fa-money-bill-wave"></i>Cash at Hotel</label></div>
<div data-panel="card"><div class="field"><label for="card">Card number</label><input id="card" name="card" type="text" inputmode="numeric" placeholder="4111 1111 1111 1111" maxlength="19"><span class="err" id="e_card"></span></div><div class="row"><div class="field"><label for="exp">Expiry (MM/YY)</label><input id="exp" name="exp" type="text" placeholder="08/29" maxlength="5"><span class="err" id="e_exp"></span></div><div class="field"><label for="cvv">CVV</label><input id="cvv" name="cvv" type="password" maxlength="4"><span class="err" id="e_cvv"></span></div></div><div class="field"><label for="holder">Name on card</label><input id="holder" name="holder" type="text" ><span class="err" id="e_holder"></span></div></div>
<div data-panel="upi" hidden><div class="field"><label for="upi">UPI ID</label><input id="upi" name="upi" type="text" placeholder="name@bank"><span class="err" id="e_upi"></span></div></div>
<div data-panel="bank" hidden><div class="field"><label for="bank">Bank</label><select id="bank" name="bank"><option value="">Select bank</option><option>State Bank of India</option><option>HDFC Bank</option><option>ICICI Bank</option><option>Axis Bank</option></select></div></div>
<div data-panel="cash" hidden><p style="color:var(--muted);margin-bottom:16px">Your room is held now. Pay the full amount at the front desk on arrival.</p></div>
<p class="err" id="payErr" style="margin-bottom:10px"></p><button class="btn" id="payBtn">Pay and confirm</button></form><aside class="card" id="paySummary"></aside></div></div></section>
<footer id="foot"></footer><div id="toasts" aria-live="polite"></div><script src="js/app.js"></script><script src="js/auth.js"></script><script src="js/booking.js"></script></body></html>
