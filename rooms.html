<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rooms | Star Hotel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700&family=Marcellus&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="css/style.css"></head>
<body data-page="rooms"><div id="loader"><i class="fa-solid fa-star"></i></div><header id="nav"></header>
<section class="page-hero"><div class="wrap"><h1>Our rooms</h1><p>Filter by type, price or dates to find your room.</p></div></section>
<section class="sec" style="padding-top:40px"><div class="wrap"><div class="card filters"><div><label for="fText">Search</label><input id="fText" placeholder="e.g. balcony"></div><div><label for="fType">Room type</label><select id="fType"></select></div>
<div><label for="fSort">Sort by price</label><select id="fSort"><option value="">Default</option><option value="low">Low to high</option><option value="high">High to low</option></select></div>
<div><label for="fGuests">Guests</label><select id="fGuests"><option value="">Any</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div>
<div><label for="fCi">Check-in</label><input type="date" id="fCi"></div><div><label for="fCo">Check-out</label><input type="date" id="fCo"></div>
<div><label for="fMax">Max price: <span id="maxLbl"></span></label><input type="range" id="fMax" min="2000" max="30000" step="500" value="30000"></div><div><button class="btn line" id="fReset" type="button" style="color:var(--navy)">Reset</button></div></div>
<p id="count" style="margin-bottom:16px;color:var(--muted)"></p><div class="grid" id="roomGrid"></div></div></section>
<footer id="foot"></footer><div id="toasts" aria-live="polite"></div><script src="js/app.js"></script><script src="js/auth.js"></script><script src="js/rooms.js"></script></body></html>
