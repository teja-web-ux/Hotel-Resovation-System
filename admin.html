<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin dashboard | Star Hotel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700&family=Marcellus&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="css/style.css"></head>
<body data-page="admin"><div id="loader"><i class="fa-solid fa-star"></i></div>
<div class="adm"><aside class="side"><a class="logo" href="index.html"><i class="fa-solid fa-star"></i>Star Hotel</a><button data-s="dash"><i class="fa-solid fa-chart-line"></i>Dashboard</button><button data-s="bookings"><i class="fa-solid fa-calendar-check"></i>Bookings</button><button data-s="rooms"><i class="fa-solid fa-bed"></i>Rooms</button><button data-s="users"><i class="fa-solid fa-users"></i>Users</button><a href="index.html"><i class="fa-solid fa-globe"></i>View website</a><button id="out"><i class="fa-solid fa-right-from-bracket"></i>Logout</button></aside>
<div class="main"><div class="top"><button class="btn dark sm side-toggle" id="menu" aria-label="Menu"><i class="fa-solid fa-bars"></i></button><span>Signed in as <b id="who"></b></span></div>
<section id="s-dash"><div class="top"><h2>Dashboard</h2></div><div class="stats" id="stats"></div><div class="two"><div class="card"><h3 style="margin-bottom:12px">Revenue by room</h3><div id="revBars"></div></div><div class="card"><h3 style="margin-bottom:12px">Booking status</h3><div id="statusList"></div></div></div></section>
<section id="s-bookings"><div class="top"><h2>Bookings</h2><div class="tools"><input id="bSearch" placeholder="Search ID, guest, room" aria-label="Search bookings"><select id="bStatus" aria-label="Filter by status"><option value="">All statuses</option><option>Pending</option><option>Confirmed</option><option>Completed</option><option>Cancelled</option></select></div></div><div class="tw"><table><thead><tr><th>ID</th><th>Guest</th><th>Room</th><th>Dates</th><th>Total</th><th>Payment</th><th>Status</th></tr></thead><tbody id="bBody"></tbody></table></div></section>
<section id="s-rooms"><div class="top"><h2>Rooms</h2><button class="btn" id="addRoom"><i class="fa-solid fa-plus"></i> Add room</button></div><div class="tw"><table><thead><tr><th>ID</th><th>Photo</th><th>Room</th><th>Price</th><th>Guests</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rBody"></tbody></table></div></section>
<section id="s-users"><div class="top"><h2>Users</h2><div class="tools"><input id="uSearch" placeholder="Search name or email" aria-label="Search users"></div></div><div class="tw"><table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Bookings</th></tr></thead><tbody id="uBody"></tbody></table></div></section></div></div>
<div id="toasts" aria-live="polite"></div><script src="js/app.js"></script><script src="js/auth.js"></script><script src="js/booking.js"></script><script src="js/admin.js"></script></body></html>
